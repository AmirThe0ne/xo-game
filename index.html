<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>

        <div class="left-panel">
            <div class="game-controls">
                <div class="mode-selection">
                    <label>
                        <input type="radio" name="mode" value="pvp" checked> Player vs Player
                    </label>
                    <label>
                        <input type="radio" name="mode" value="pvc"> Player vs Computer
                    </label>
                </div>
            </div>

            <button id="reset-btn">Reset Game</button>

            <div class="score-board">
                <h3>Game Results</h3>
                <p>Player X Wins: <span id="x-wins">0</span></p>
                <p>Player O Wins: <span id="o-wins">0</span></p>
                <p>Draws: <span id="draws">0</span></p>
                <button id="reset-scores-btn">Reset Scores</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="status-board">
                <h2 id="status">Player X's turn</h2>
            </div>

            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
